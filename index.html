<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11161A" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    connect-src 'self' https://*.supabase.co;
    img-src 'self' data: https://*.supabase.co;
    style-src 'self' 'unsafe-inline';
    font-src 'self' data:;
    base-uri 'self';
    form-action 'self';
    frame-ancestors 'none';
  ">
  <title>Jalonya</title>

  <!-- Polices auto-hébergées (RGPD : aucun appel Google Fonts) -->
  <link rel="stylesheet" href="css/fonts.css?v=20261128c" />
  <link rel="stylesheet" href="css/style.css?v=20261128c" />
  <link rel="stylesheet" href="css/habillage-ecf.css?v=20261128c" />
  <link rel="stylesheet" href="css/livret.css?v=20261128c" />
  <link rel="stylesheet" href="css/dp.css?v=20261128c" />
  <link rel="stylesheet" href="css/cours-blocs.css?v=20261128c" />
  <link rel="stylesheet" href="css/emargement.css?v=20261128c" />
  <link rel="stylesheet" href="css/qualiopi.css?v=20261128c" />
  <link rel="stylesheet" href="css/contact.css?v=20261128c" />
  <link rel="stylesheet" href="css/navigation.css?v=20261128c" />
  <link rel="stylesheet" href="css/signalement.css?v=20261128c" />
  <link rel="stylesheet" href="css/pages.css?v=20261128c" />
  <link rel="stylesheet" href="css/themes-lignes.css?v=20261128c" />
  <link rel="stylesheet" href="css/questionnaire.css?v=20261128c" />
  <!-- Habillage choisi (Jalonya ou Couleurs ECF) : posé avant la première peinture, d'après ce que l'appareil
       a retenu. Script classique, après les feuilles de style pour que la couleur de la barre d'état se lise. -->
  <script src="js/habillage-avant-peinture.js?v=20261128c"></script>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml" />
  <!-- Écran d'accueil iOS : Safari n'accepte pas de SVG et rend la transparence en noir.
       PNG 180x180 opaque (J crème sur le fond olive de l'app), coins laissés
       carrés : iOS applique lui-même son masque arrondi. Tiré de docs/branding_jalonya du dépôt ECSR. -->
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Jalonya" />
  <!-- App installable : ouverte depuis l'écran d'accueil, elle s'affiche en plein écran,
       sans barre de navigateur. Aucun service worker, donc pas de mode hors ligne ni de
       cache à part : chaque ouverture charge la version en ligne. Barre d'état iOS
       « black » (et non « black-translucent ») : la barre du haut de l'app ne réserve pas
       la place de l'encoche. -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>
<body>

  <!-- Password gate -->
  <div id="gate" class="gate hidden">
    <div class="gate-col">
      <img class="gate-logo" src="assets/logo/jalonya-logo-negatif.svg" alt="Jalonya" />
      <div class="gate-card">
        <h1 id="gate-titre">Bienvenue</h1>
        <p class="gate-sous-titre" id="gate-subtitle">Connectez-vous avec l'adresse e-mail de votre compte.</p>
        <div class="gate-tabs" role="tablist">
          <button class="gate-tab active" id="gate-tab-signin" role="tab" type="button">Connexion</button>
          <button class="gate-tab" id="gate-tab-signup" role="tab" type="button">Créer un compte</button>
        </div>
        <!-- Un vrai formulaire : la touche Entrée l'envoie, et le trousseau du téléphone ou du navigateur propose
             d'enregistrer le mot de passe. js/gate.js en arrête l'envoi (rien ne part vers une adresse). -->
        <form class="gate-form" id="gate-formulaire" novalidate>
          <div class="gate-champ" id="gate-champ-email">
            <label for="gate-email">Adresse e-mail</label>
            <input type="email" id="gate-email" name="email" placeholder="prenom.nom@exemple.fr" autocomplete="email" />
          </div>
          <div class="gate-champ" id="gate-champ-password">
            <label for="gate-password" id="gate-password-libelle">Mot de passe</label>
            <div class="gate-mdp">
              <input type="password" id="gate-password" name="password" autocomplete="current-password" />
              <button type="button" class="gate-afficher" id="gate-afficher" aria-pressed="false" aria-controls="gate-password">Afficher</button>
            </div>
          </div>
          <div class="gate-champ hidden" id="gate-champ-confirmation">
            <label for="gate-confirmation">Confirmer le mot de passe</label>
            <input type="password" id="gate-confirmation" name="confirmation" autocomplete="new-password" />
          </div>
          <div class="gate-ligne-oubli" id="gate-ligne-oubli">
            <button type="button" class="gate-link" id="gate-oubli">Mot de passe oublié ?</button>
          </div>
          <button type="submit" id="gate-submit" class="btn primary">Se connecter</button>
        </form>
        <p class="error hidden" id="gate-error"></p>
        <p class="gate-info hidden" id="gate-info"></p>
        <button type="button" class="gate-link hidden" id="gate-retour">Retour à la connexion</button>
        <p class="gate-hint" id="gate-hint">Pas encore de compte ? Il se crée sur invitation de votre centre de formation.</p>
      </div>
      <div class="gate-pied">
        <a href="https://jalonya.fr/" target="_blank" rel="noopener">jalonya.fr</a>
        <button type="button" class="gate-link" id="gate-legal">Informations légales</button>
      </div>
    </div>
  </div>

  <!-- App -->
  <div id="app" class="hidden">
    <!-- La barre de navigation (js/nav-shell.js) se monte ici, en tête de #app. -->
    <main id="view"></main>

    <div id="toast" class="toast hidden"></div>
  </div>

  <script type="module" src="js/main.js?v=20261128c"></script>
</body>
</html>
