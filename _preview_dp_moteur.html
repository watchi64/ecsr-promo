<!DOCTYPE html>
<!-- Banc temporaire du moteur de composition. Supprimé en tâche 7. Il n'utilise
     pas le gabarit du DP : des blocs de contrôle suffisent à prouver la coupe. -->
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Banc · moteur de composition DP</title>
  <script>
    window.__cssPrete = Promise.all(["css/livret.css", "css/dp.css"].map((f) => new Promise((ok) => {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = `${f}?cb=${Date.now()}`;
      l.onload = l.onerror = ok;
      document.head.appendChild(l);
    })));
  </script>
  <style>
    body { margin: 20px; background: #e8e8e4; font-family: sans-serif; }
    #rapport { margin-bottom: 12px; font-size: 13px; white-space: pre-line; }
    .ok { color: #2f6f3e; } .ko { color: #b00020; font-weight: 700; }
  </style>
</head>
<body>
  <div id="rapport">mesure en cours</div>
  <div id="hote"></div>
  <script type="module">
    const cb = Date.now();
    const { feuille } = await import(`./js/views/dp-gabarit.js?cb=${cb}`);
    const { composer, PX_PAR_MM, HAUTEUR_MIN_MORCEAU } =
      await import(`./js/dp-pagination.js?cb=${cb}`);
    await window.__cssPrete;

    // Un texte long et déterministe : 900 mots courts, largement plus qu'une feuille.
    const MOTS = Array.from({ length: 900 }, (_, i) => `mot${i}`).join(" ");

    const flux = document.createElement("div");
    flux.className = "dp-doc dp-flux";
    flux.innerHTML = `
      <div class="dp-bloc" data-cle="un" data-ouvrant="1" data-nature="atomique">
        <p><b>Rubrique un</b></p></div>
      <div class="dp-bloc" data-cle="deux" data-ouvrant="1" data-nature="atomique"
           data-avec-suivant="1"><p><b>Rubrique deux, intitulé</b></p></div>
      <div class="dp-bloc dp-zone" data-cle="deux" data-nature="secable"></div>
      <div class="dp-bloc" data-cle="trois" data-ouvrant="1" data-nature="atomique">
        <p><b>Rubrique trois</b></p></div>`;
    flux.querySelector(".dp-zone").textContent = MOTS;
    document.body.appendChild(flux);
    flux.style.position = "absolute";
    flux.style.left = "-20000px";

    const hote = document.createElement("div");
    hote.className = "dp-doc dp-screen";
    document.getElementById("hote").appendChild(hote);

    const blocs = [...flux.children].filter((n) => n.classList.contains("dp-bloc"));
    const res = composer(blocs, {
      hote,
      fabriquerFeuille: (numero, couv) => {
        const d = document.createElement("div");
        d.innerHTML = feuille("", numero, couv);
        return d.firstElementChild;
      },
    });

    // --- Contrôles ---
    const lignes = [];
    const dire = (ok, texte) => lignes.push(`${ok ? "OK  " : "KO  "}${texte}`);

    dire(res.feuilles >= 3, `feuilles produites : ${res.feuilles} (attendu au moins 3)`);

    // Aucun texte perdu : la concaténation des morceaux doit rendre l'original.
    const morceaux = [...hote.querySelectorAll(".dp-zone")].map((n) => n.textContent).join("");
    dire(morceaux.replace(/\s+/g, " ").trim() === MOTS,
      `texte reconstitué identique à l'original (${morceaux.length} caractères contre ${MOTS.length})`);

    // Aucune feuille ne déborde de sa hauteur utile.
    const debordent = [...hote.querySelectorAll(".dp-corps")]
      .filter((c) => c.scrollHeight > c.clientHeight + 1).length;
    dire(debordent === 0, `feuilles en débordement : ${debordent} (attendu 0)`);

    // Numérotation continue dans les pieds de page.
    const numeros = [...hote.querySelectorAll(".dp-pied")]
      .map((p) => Number(p.innerText.match(/Page (\d+)/)[1]));
    dire(numeros.every((n, i) => n === i + 1), `pieds numérotés ${numeros.join(", ")}`);

    // Les morceaux de suite ne portent plus de data-k : le document composé n'est
    // jamais une source de données.
    const fuite = hote.querySelectorAll(".dp-zone[data-k]").length;
    dire(fuite === 0, `zones composées portant encore data-k : ${fuite} (attendu 0)`);

    // Chaque rubrique ouvrante DÉMARRE une feuille : son premier bloc doit être
    // le premier élément du corps de sa feuille. Comparer des numéros de feuille
    // ne prouverait rien, une rubrique pouvant commencer au milieu d'une feuille
    // sans que son numéro change.
    const feuillesDom = [...hote.querySelectorAll(".dp-feuille")];
    const malPlacees = [...res.numeroParCle.entries()]
      .filter(([cle, numero]) => {
        const c = feuillesDom[numero - 1] && feuillesDom[numero - 1].querySelector(".dp-corps");
        return !c || !c.firstElementChild || c.firstElementChild.dataset.cle !== cle;
      })
      .map(([cle]) => cle);
    dire(malPlacees.length === 0,
      `rubriques démarrant une feuille neuve : ${malPlacees.length === 0
        ? res.numeroParCle.size + " sur " + res.numeroParCle.size
        : "échec pour " + malPlacees.join(", ")}`);

    // --- Scénario A : bloc insécable plus haut qu'une feuille ---
    // Un seul bloc atomique, dont le texte dépasse largement une feuille : le
    // moteur doit le garder intact et lever la coupe plutôt que perdre du texte.
    // C'est le garde-fou qui pose la classe dp-corps-deborde sur un corps de
    // feuille dont le premier bloc dépasse à lui seul la hauteur utile.
    const texteBlocHautA = Array.from({ length: 200 },
      (_, i) => `Paragraphe ${i} du bloc insécable, volontairement long pour dépasser une feuille entière.`).join(" ");
    const fluxA = document.createElement("div");
    fluxA.className = "dp-doc dp-flux";
    fluxA.innerHTML = `
      <div class="dp-bloc" data-cle="haut" data-ouvrant="1" data-nature="atomique">
        <p><b>Bloc insécable</b></p>
        <p class="dp-texte-haut">${texteBlocHautA}</p>
      </div>`;
    document.body.appendChild(fluxA);
    fluxA.style.position = "absolute";
    fluxA.style.left = "-20000px";

    const hoteA = document.createElement("div");
    hoteA.className = "dp-doc dp-screen";
    hoteA.style.position = "absolute";
    hoteA.style.left = "-20000px";
    document.body.appendChild(hoteA);

    const blocsA = [...fluxA.children].filter((n) => n.classList.contains("dp-bloc"));
    const resA = composer(blocsA, {
      hote: hoteA,
      fabriquerFeuille: (numero, couv) => {
        const d = document.createElement("div");
        d.innerHTML = feuille("", numero, couv);
        return d.firstElementChild;
      },
    });

    const texteComposeA = [...hoteA.querySelectorAll(".dp-texte-haut")].map((n) => n.textContent).join("");
    dire(texteComposeA === texteBlocHautA,
      `scénario A : texte du bloc insécable intégralement présent (${texteComposeA.length} caractères contre ${texteBlocHautA.length})`);

    const corpsDebordeA = hoteA.querySelectorAll(".dp-corps.dp-corps-deborde").length;
    dire(resA.feuilles === 1 && corpsDebordeA === 1,
      `scénario A : feuille unique marquée dp-corps-deborde (feuilles=${resA.feuilles}, débordantes=${corpsDebordeA})`);

    // --- Scénario B : intitulé orphelin ---
    // On mesure d'abord, sur une feuille neuve, la hauteur d'une ligne de
    // remplissage et celle de l'intitulé : ça permet de calculer, sans nombre
    // de lignes codé en dur (fragile, propre au rendu d'une machine), combien
    // de lignes poser avant l'intitulé pour ne laisser que quelques
    // millimètres en bas de feuille, sous le seuil HAUTEUR_MIN_MORCEAU (10 mm).
    const hoteMesureB = document.createElement("div");
    hoteMesureB.className = "dp-doc dp-screen";
    hoteMesureB.style.position = "absolute";
    hoteMesureB.style.left = "-20000px";
    document.body.appendChild(hoteMesureB);

    const feuilleMesureB = (() => {
      const d = document.createElement("div");
      d.innerHTML = feuille("", 1, false);
      return d.firstElementChild;
    })();
    hoteMesureB.appendChild(feuilleMesureB);
    const corpsMesureB = feuilleMesureB.querySelector(".dp-corps");
    const hUtileB = corpsMesureB.clientHeight;

    const ligneProbeB = document.createElement("div");
    ligneProbeB.className = "dp-bloc";
    ligneProbeB.textContent = "Ligne de remplissage 0, juste assez pour occuper une ligne pleine.";
    corpsMesureB.appendChild(ligneProbeB);
    const hauteurLigneB = ligneProbeB.getBoundingClientRect().height;
    corpsMesureB.removeChild(ligneProbeB);

    const intituleProbeB = document.createElement("div");
    intituleProbeB.className = "dp-bloc";
    intituleProbeB.innerHTML = "<p><b>Question orpheline</b></p>";
    corpsMesureB.appendChild(intituleProbeB);
    const hauteurIntituleB = intituleProbeB.getBoundingClientRect().height;
    document.body.removeChild(hoteMesureB);

    // Une feuille neuve tient environ ce nombre de lignes de remplissage ; on
    // s'arrête deux lignes avant le bas : assez de place pour que l'intitulé
    // tienne encore, mais moins de 10 mm une fois l'intitulé posé.
    const lignesParFeuilleB = Math.floor(hUtileB / hauteurLigneB);
    const nLignesRemplissageB = Math.max(1, lignesParFeuilleB - 2);

    let htmlB = "";
    for (let i = 0; i < nLignesRemplissageB; i += 1) {
      htmlB += `<div class="dp-bloc" data-cle="orphelin" data-nature="secable"${i === 0 ? ' data-ouvrant="1"' : ""}>Ligne de remplissage ${i}, juste assez pour occuper une ligne pleine.</div>`;
    }
    htmlB += `<div class="dp-bloc" data-cle="orphelin" data-nature="atomique" data-avec-suivant="1"><p><b>Question orpheline</b></p></div>`;
    htmlB += `<div class="dp-bloc dp-zone" data-cle="orphelin" data-nature="secable"></div>`;

    const fluxB = document.createElement("div");
    fluxB.className = "dp-doc dp-flux";
    fluxB.innerHTML = htmlB;
    fluxB.querySelector(".dp-zone").textContent =
      Array.from({ length: 300 }, (_, i) => `reponse${i}`).join(" ");
    document.body.appendChild(fluxB);
    fluxB.style.position = "absolute";
    fluxB.style.left = "-20000px";

    const hoteB = document.createElement("div");
    hoteB.className = "dp-doc dp-screen";
    hoteB.style.position = "absolute";
    hoteB.style.left = "-20000px";
    document.body.appendChild(hoteB);

    const blocsB = [...fluxB.children].filter((n) => n.classList.contains("dp-bloc"));
    const indexIntituleB = blocsB.findIndex((b) => b.dataset.avecSuivant === "1");
    const resB = composer(blocsB, {
      hote: hoteB,
      fabriquerFeuille: (numero, couv) => {
        const d = document.createElement("div");
        d.innerHTML = feuille("", numero, couv);
        return d.firstElementChild;
      },
    });

    // La garde promet qu'une zone de réponse peut COMMENCER sous son intitulé
    // avec au moins HAUTEUR_MIN_MORCEAU de hauteur. Comparer les numéros de
    // feuille de l'intitulé et de sa zone ne prouverait rien : sans la garde, un
    // fragment de quelques mots s'accroche encore sous l'intitulé et les deux
    // numéros restent égaux. On mesure donc ce qui est réellement posé.
    const feuilleIntituleB = resB.numeroParBloc[indexIntituleB];
    const feuillesB = [...hoteB.querySelectorAll(".dp-feuille")];
    const corpsIntituleB = feuillesB[feuilleIntituleB - 1]
      && feuillesB[feuilleIntituleB - 1].querySelector(".dp-corps");
    const intituleComposeB = corpsIntituleB && corpsIntituleB.querySelector('[data-avec-suivant="1"]');
    const suivantB = intituleComposeB && intituleComposeB.nextElementSibling;
    const hauteurZoneB = suivantB && suivantB.classList.contains("dp-zone")
      ? suivantB.getBoundingClientRect().height : 0;
    dire(hauteurZoneB >= HAUTEUR_MIN_MORCEAU,
      `scénario B : ${(hauteurZoneB / PX_PAR_MM).toFixed(1)} mm de zone posés sous l'intitulé `
      + `de la feuille ${feuilleIntituleB} (seuil ${(HAUTEUR_MIN_MORCEAU / PX_PAR_MM).toFixed(1)} mm)`);

    const r = document.getElementById("rapport");
    r.textContent = lignes.join("\n");
    r.className = lignes.some((l) => l.startsWith("KO")) ? "ko" : "ok";
  </script>
</body>
</html>
