<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 460" width="340" height="460" role="img" aria-label="Vue de dessus, circulation vers le haut : trois fleches courbes obliquent vers la voie de droite, puis la ligne d axe discontinue devient continue">
  <!-- Vue de dessus, sens de circulation vers le HAUT (convention des supports
       d auto-ecole). Axe discontinu T1 en bas, continu a partir du rabattement.
       Les fleches partent de l axe et obliquent vers la voie de droite. -->
  <rect x="0" y="0" width="340" height="460" fill="#4f5257"/>
  <rect x="0" y="0" width="16" height="460" fill="#7a7264"/>
  <rect x="324" y="0" width="16" height="460" fill="#7a7264"/>

  <!-- axe : continu en haut (de 0 a 150), discontinu T1 en dessous -->
  <g fill="#f2f2f2">
    <rect x="150" y="0" width="8" height="150"/>
      <rect x="150" y="422.0" width="8" height="24.0"/>
      <rect x="150" y="318.0" width="8" height="24.0"/>
      <rect x="150" y="214.0" width="8" height="24.0"/>
  </g>

  <!-- ligne de rive T'1, a droite -->
  <g fill="#f2f2f2" opacity="0.8">
      <rect x="300" y="434.0" width="6" height="12.0"/>
      <rect x="300" y="382.0" width="6" height="12.0"/>
      <rect x="300" y="330.0" width="6" height="12.0"/>
      <rect x="300" y="278.0" width="6" height="12.0"/>
      <rect x="300" y="226.0" width="6" height="12.0"/>
      <rect x="300" y="174.0" width="6" height="12.0"/>
      <rect x="300" y="122.0" width="6" height="12.0"/>
      <rect x="300" y="70.0" width="6" height="12.0"/>
      <rect x="300" y="18.0" width="6" height="12.0"/>
  </g>

  <!-- trois fleches de rabattement -->
  <g fill="#f2f2f2">
    <path d="M174.0,240.0 Q176.0,194.0 194.0,170.0 L186.0,162.0 L212.0,148.0 L208.0,177.0 L200.0,169.0 Q184.0,192.0 183.0,240.0 Z"/>
    <path d="M174.0,330.0 Q176.0,284.0 194.0,260.0 L186.0,252.0 L212.0,238.0 L208.0,267.0 L200.0,259.0 Q184.0,282.0 183.0,330.0 Z"/>
    <path d="M174.0,420.0 Q176.0,374.0 194.0,350.0 L186.0,342.0 L212.0,328.0 L208.0,357.0 L200.0,349.0 Q184.0,372.0 183.0,420.0 Z"/>
  </g>
</svg>
